name: cess-docuflow

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    environment:
      PORT: 5000
      NODE_ENV: development

    ports:
      - "5000:5000"

    restart: unless-stopped

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped