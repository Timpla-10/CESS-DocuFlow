name: CESS DocuFlow CI

on:
  push:
    branches:
      - Main
      - Frontend
      - Backend

  pull_request:
    branches:
      - Main
      - Frontend
      - Backend

  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect Workspace Targets
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.check.outputs.has_frontend }}
      has_backend: ${{ steps.check.outputs.has_backend }}
      has_docker: ${{ steps.check.outputs.has_docker }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Available Targets
        id: check
        run: |
          if [ -f app/package.json ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f backend/package.json ]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f docker-compose.yml ] && [ -f app/Dockerfile ] && [ -f backend/Dockerfile ]; then
            echo "has_docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_docker=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_frontend == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: app
        run: npm ci --include=dev

      - name: Lint Frontend
        working-directory: app
        run: npm run lint

      - name: Build React Application
        working-directory: app
        run: npm run build

  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_backend == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Check Backend Syntax
        run: |
          find backend -name "*.js" -not -path "backend/node_modules/*" -print0 | xargs -0 -n 1 node --check

      - name: Run Isolated Backend Security & Session Mock Tests
        run: |
          MOCK_TESTS=(
            backend/tests/test-auth-security-hardening-mock.js
            backend/tests/test-oauth-and-header-hardening-mock.js
            backend/tests/test-session-persistence-mock.js
            backend/tests/test-staging-safety-guard-mock.js
          )
          RAN=0
          for test_file in "${MOCK_TESTS[@]}"; do
            if [ -f "$test_file" ]; then
              echo "Running $test_file"
              node "$test_file"
              RAN=$((RAN + 1))
            fi
          done
          if [ "$RAN" -gt 0 ] && [ "$RAN" -ne "${#MOCK_TESTS[@]}" ]; then
            echo "Error: Partial mock test suite detected ($RAN/${#MOCK_TESTS[@]})."
            exit 1
          fi
          if [ "$RAN" -eq 0 ]; then
            echo "No isolated backend mock test suites present on this branch yet."
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - detect
      - frontend
      - backend
    if: |
      always() &&
      needs.detect.outputs.has_docker == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --no-env-resolution --quiet

      - name: Build Frontend Docker Image
        run: docker build -t cess-docuflow-frontend:ci ./app

      - name: Build Backend Docker Image
        run: docker build -t cess-docuflow-backend:ci ./backend
