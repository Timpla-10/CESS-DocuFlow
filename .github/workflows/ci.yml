name: CESS DocuFlow CI

on:
  push:
    branches:
      - Main
      - Frontend
      - Backend

  pull_request:
    branches:
      - Main
      - Frontend
      - Backend

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: app
        run: npm ci

      - name: Lint Frontend
        working-directory: app
        run: npm run lint

      - name: Build React Application
        working-directory: app
        run: npm run build

  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Check Backend Syntax
        run: |
          find backend -name "*.js" -not -path "backend/node_modules/*" -print0 | xargs -0 -n 1 node --check

      - name: Run Isolated Backend Security & Session Mock Tests
        run: |
          node backend/tests/test-auth-security-hardening-mock.js
          node backend/tests/test-oauth-and-header-hardening-mock.js
          node backend/tests/test-session-persistence-mock.js
          node backend/tests/test-staging-safety-guard-mock.js

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --no-env-resolution --quiet

      - name: Build Frontend Docker Image
        run: docker build -t cess-docuflow-frontend:ci ./app

      - name: Build Backend Docker Image
        run: docker build -t cess-docuflow-backend:ci ./backend
